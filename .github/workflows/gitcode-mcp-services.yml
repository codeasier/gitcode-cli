name: GitCode MCP services compatibility

on:
  push:
    branches: [main]
    paths:
      - src/gitcode_cli/**
      - pyproject.toml
      - packages/gitcode-mcp/**
      - .github/workflows/gitcode-mcp-services.yml
  pull_request:
    paths:
      - src/gitcode_cli/**
      - pyproject.toml
      - packages/gitcode-mcp/**
      - .github/workflows/gitcode-mcp-services.yml
  workflow_dispatch:
  workflow_call:

permissions:
  contents: read

concurrency:
  group: mcp-services-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  source-compatibility:
    name: MCP services / Python ${{ matrix.python-version }}
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        python-version: ['3.11', '3.12', '3.13']
    defaults:
      run:
        shell: bash
        working-directory: packages/gitcode-mcp
    env:
      PYTEST_ADDOPTS: ''
      PIP_DISABLE_PIP_VERSION_CHECK: '1'
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install MCP dependencies and override only the CLI distribution with this checkout
        run: |
          python -m pip install -e '.[dev]'
          # Compatibility probe only: the published MCP dependency remains 0.1.6.
          python -m pip install --no-deps --force-reinstall "$GITHUB_WORKSPACE"
      - name: Verify the client and every service came from this checkout
        run: |
          python -I - <<'PY'
          import hashlib
          import os
          from pathlib import Path
          import gitcode_cli.client

          source = Path(os.environ['GITHUB_WORKSPACE']) / 'src/gitcode_cli'
          installed = Path(gitcode_cli.client.__file__).resolve().parent
          assert installed != source.resolve(), 'Expected an isolated distribution install'
          expected = {Path('client.py'), *(p.relative_to(source) for p in (source / 'services').rglob('*.py'))}
          actual = {Path('client.py'), *(p.relative_to(installed) for p in (installed / 'services').rglob('*.py'))}
          assert actual == expected, (actual, expected)
          for path in sorted(expected):
              assert hashlib.sha256((installed / path).read_bytes()).digest() == hashlib.sha256((source / path).read_bytes()).digest(), path
          print(f'Verified {len(expected)} installed client/service files against the checkout')
          PY
      - name: Run the full MCP suite against current CLI services, without real GitCode requests
        run: python -I -m pytest -c pyproject.toml tests
