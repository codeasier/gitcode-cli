name: GitCode MCP

on:
  push:
    branches: [main]
    paths:
      - packages/gitcode-mcp/**
      - deploy/gitcode-mcp/**
      - docs/gitcode/**
      - .github/workflows/gitcode-mcp.yml
  pull_request:
    paths:
      - packages/gitcode-mcp/**
      - deploy/gitcode-mcp/**
      - docs/gitcode/**
      - .github/workflows/gitcode-mcp.yml
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: gitcode-mcp-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  mcp:
    name: MCP / Python ${{ matrix.python-version }}
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        python-version: ['3.11', '3.12', '3.13']
    defaults:
      run:
        shell: bash
        working-directory: packages/gitcode-mcp
    env:
      # Never inherit the root CLI's coverage/configuration options.
      PYTEST_ADDOPTS: ''
      PIP_DISABLE_PIP_VERSION_CHECK: '1'
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4
        with:
          persist-credentials: false
      - name: Check out the immutable pre-migration source
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4
        with:
          repository: codeasier/codex-codeasier
          ref: f93b67bb7048e556b44322d48664522f32651920
          path: .mcp-legacy
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install MCP test dependencies only
        run: python -m pip install -e '.[dev]'
      - name: Lint MCP independently
        run: |
          python -m ruff check --config pyproject.toml .
          python -m ruff format --check --config pyproject.toml .
      - name: Test MCP independently
        run: python -I -m pytest -c pyproject.toml tests
      - name: Build wheel and sdist (no publication)
        run: python -m build
      - name: Prepare the isolated legacy installation
        run: |
          test "$(git -C "$GITHUB_WORKSPACE/.mcp-legacy" rev-parse HEAD)" = f93b67bb7048e556b44322d48664522f32651920
          python -m venv "$RUNNER_TEMP/mcp-legacy"
          "$RUNNER_TEMP/mcp-legacy/bin/python" -m pip install "$GITHUB_WORKSPACE/.mcp-legacy/packages/gitcode-mcp"
      - name: Clean-install both distributions and check offline compatibility
        run: |
          set -euo pipefail
          script="$PWD/scripts/migration_acceptance.py"
          work="$(mktemp -d "$RUNNER_TEMP/mcp-acceptance.XXXXXX")"
          trap 'rm -rf "$work"' EXIT
          # Distribution installs may resolve dependencies. All acceptance
          # processes below have no credentials and reject socket networking.
          for archive in "$PWD"/dist/*.whl "$PWD"/dist/*.tar.gz; do
            test -f "$archive"
            target="$work/$(basename "$archive")"
            python -m venv "$target"
            "$target/bin/python" -m pip install "$archive"
            mkdir "$target/home"
            cd "$target"
            env -i PATH="$target/bin:/usr/bin:/bin" HOME="$target/home" \
              "$target/bin/python" -I "$script" smoke
            # The old process must exit and close SQLite before the new one
            # opens the same database. Never run two workers on the fixture.
            env -i PATH=/usr/bin:/bin HOME="$target/home" \
              "$RUNNER_TEMP/mcp-legacy/bin/python" -I "$script" seed "$target/fixture"
            env -i PATH="$target/bin:/usr/bin:/bin" HOME="$target/home" \
              "$target/bin/python" -I "$script" verify "$target/fixture"
          done
      - name: Upload distributions only (never synthetic OAuth state)
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: gitcode-mcp-python-${{ matrix.python-version }}
          path: |
            packages/gitcode-mcp/dist/*.whl
            packages/gitcode-mcp/dist/*.tar.gz
          if-no-files-found: error
          retention-days: 14

  container:
    name: MCP / Container packaging
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4
        with:
          persist-credentials: false
      - name: Build migrated Docker context (no push)
        run: docker build -f deploy/gitcode-mcp/Dockerfile -t gitcode-mcp-ci:${{ github.sha }} .
      - name: Check both installed entry points without networking or writable root
        run: |
          set -euo pipefail
          image=gitcode-mcp-ci:${{ github.sha }}
          test "$(docker image inspect --format '{{.Config.User}}' "$image")" = '10001:10001'
          for entrypoint in gitcode-mcp gitcode-clone; do
            docker run --rm --network=none --read-only --cap-drop=ALL \
              --security-opt=no-new-privileges "$image" "$entrypoint" --help
          done
          docker run --rm --network=none --read-only --cap-drop=ALL \
            --security-opt=no-new-privileges "$image" python -I -c \
            'from importlib.metadata import distribution; d = distribution("codeasier-gitcode-mcp"); assert d.version == "0.3.0"; assert any(p.name == "LICENSE" and "codeasier" in d.locate_file(p).read_text().lower() for p in d.files)'

  volume-migration:
    name: MCP / Named-volume takeover and rollback
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4
        with:
          persist-credentials: false
      - name: Check out the immutable pre-migration deployment
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4
        with:
          repository: codeasier/codex-codeasier
          ref: f93b67bb7048e556b44322d48664522f32651920
          path: .mcp-legacy
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.12'
      - name: Build temporary old and new images (dependency downloads allowed; no publication)
        run: |
          set -euo pipefail
          test "$(git -C .mcp-legacy rev-parse HEAD)" = f93b67bb7048e556b44322d48664522f32651920
          docker build -f .mcp-legacy/deploy/gitcode-mcp/Dockerfile -t gitcode-mcp-volume-old:${{ github.sha }} .mcp-legacy
          docker build -f deploy/gitcode-mcp/Dockerfile -t gitcode-mcp-volume-new:${{ github.sha }} .
      - name: Exercise real Compose volume reuse with offline HTTP and rollback
        shell: bash
        run: |
          set -euo pipefail
          script="$PWD/packages/gitcode-mcp/scripts/volume_acceptance.py"
          run_id="$(python -c 'import secrets; print(secrets.token_hex(8))')"
          trap 'python -I "$script" cleanup "$run_id"' EXIT
          # Only this synthetic acceptance is offline; image builds above may
          # download public dependencies. No host ports, secrets or production
          # volumes are used. No fixture/env-file/log artifact is uploaded.
          python -I "$script" run "$PWD" "$PWD/.mcp-legacy" \
            gitcode-mcp-volume-old:${{ github.sha }} \
            gitcode-mcp-volume-new:${{ github.sha }} "$run_id"
