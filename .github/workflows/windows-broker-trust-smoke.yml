name: Windows broker trust smoke
on:
  pull_request:
    paths:
      - src/gitcode_cli/oauth_broker_client.py
      - tests/contracts/test_oauth_broker_trust.py
      - .github/workflows/windows-broker-trust-smoke.yml
permissions:
  contents: read
jobs:
  windows-broker-trust-smoke:
    runs-on: windows-2025
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.12'
      - name: Install checkout CLI with test dependencies
        run: python -m pip install --disable-pip-version-check ".[dev]"
      - name: Require and exercise real explicit private-CA broker TLS without transport injection
        shell: pwsh
        run: |
          if (-not (Get-Command openssl -ErrorAction SilentlyContinue)) {
            $openssl = Join-Path $env:ProgramFiles 'Git\usr\bin\openssl.exe'
            if (-not (Test-Path $openssl)) { throw 'The isolated OpenSSL test fixture is unavailable.' }
            $env:PATH = (Split-Path $openssl) + ';' + $env:PATH
          }
          python -I -c "import ssl; assert not any(ssl.SSLContext(ssl.PROTOCOL_TLS_CLIENT).cert_store_stats().values()), 'Windows runner cannot verify explicit private-CA-only trust with a preseeded store'"
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          Push-Location $env:RUNNER_TEMP
          $env:PYTEST_ADDOPTS = ''
          $probe = @'
          import hashlib
          import os
          import sysconfig
          from pathlib import Path

          import pytest
          from gitcode_cli import oauth_broker_client

          checkout = Path(os.environ["GITHUB_WORKSPACE"])
          source = checkout / "src" / "gitcode_cli" / "oauth_broker_client.py"
          installed = Path(oauth_broker_client.__file__).resolve()
          assert installed.is_relative_to(Path(sysconfig.get_paths()["purelib"]).resolve()), "Expected the installed CLI module"
          assert installed.read_bytes() == source.read_bytes(), "Installed broker client does not match the candidate"
          print("Installed broker client matches checkout:", hashlib.sha256(installed.read_bytes()).hexdigest())
          conf = Path.cwd() / "isolated-broker-trust-pytest.ini"
          conf.write_text("[pytest]\n", encoding="ascii")

          class NativeProof:
              passed = set()
              skipped = set()

              def pytest_runtest_logreport(self, report):
                  if report.skipped:
                      self.skipped.add(report.nodeid)
                  if report.when == "call" and report.passed:
                      self.passed.add(report.nodeid)

          proof = NativeProof()
          tests = checkout / "tests" / "contracts" / "test_oauth_broker_trust.py"
          rc = pytest.main(
              ["-c", str(conf), "--confcutdir", str(Path.cwd()), "--import-mode=importlib", "-rA",
               "-W", "error::RuntimeWarning", str(tests)],
              plugins=[proof],
          )
          if rc:
              raise SystemExit(rc)
          assert not proof.skipped, "A required native TLS case was skipped"
          assert any(x.endswith("::test_native_broker_tls[chosen-valid-False-2]") for x in proof.passed), "Missing explicit private-CA positive handshake"
          assert Path(oauth_broker_client.__file__).resolve() == installed
          print("Actual installed Windows explicit-CA TLS passed without transport injection.")
          '@
          $probe | python -I -
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
