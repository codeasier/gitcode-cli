name: Windows credential smoke

on:
  pull_request:
    paths:
      - "src/gitcode_cli/oauth_credential_store.py"
      - "src/gitcode_cli/oauth_account_selection.py"
      - "tests/packaging/windows_credential_smoke.py"
      - ".github/workflows/windows-credential-smoke.yml"

permissions:
  contents: read

jobs:
  windows-credential-smoke:
    runs-on: windows-2025
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install candidate CLI
        run: python -m pip install --disable-pip-version-check .
      - name: Round-trip synthetic local credential and selection
        run: python -I tests/packaging/windows_credential_smoke.py
