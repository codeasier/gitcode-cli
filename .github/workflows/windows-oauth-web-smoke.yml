name: Windows OAuth web login smoke

on:
  pull_request:
    paths:
      - src/gitcode_cli/cli.py
      - src/gitcode_cli/commands/auth.py
      - src/gitcode_cli/config.py
      - src/gitcode_cli/oauth_account_selection.py
      - src/gitcode_cli/oauth_broker_client.py
      - src/gitcode_cli/oauth_credential_store.py
      - src/gitcode_cli/oauth_identity.py
      - src/gitcode_cli/oauth_login.py
      - src/gitcode_cli/oauth_web_inputs.py
      - pyproject.toml
      - tests/contracts/test_oauth_web_wincred_native.py
      - .github/workflows/windows-oauth-web-smoke.yml

permissions:
  contents: read

jobs:
  windows-oauth-web-smoke:
    # A fork skip is not evidence of a native Windows PASS.
    if: github.event.pull_request.head.repo.full_name == github.repository
    runs-on: windows-2025
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4
        with:
          persist-credentials: false
          ref: ${{ github.event.pull_request.head.sha }}
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.12'
      - name: Build the candidate wheel and install without an editable source path
        shell: pwsh
        run: |
          $wheels = Join-Path $env:RUNNER_TEMP 'oauth-web-wheels'
          python -m pip wheel --disable-pip-version-check --no-deps --wheel-dir $wheels .
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          $wheel = @(Get-ChildItem $wheels -Filter 'pygitcode-*.whl')
          if ($wheel.Count -ne 1) { throw 'Expected exactly one candidate wheel.' }
          $venv = Join-Path $env:RUNNER_TEMP 'oauth-web-install'
          python -m venv $venv
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          & (Join-Path $venv 'Scripts/python.exe') -m pip install --disable-pip-version-check $wheel[0].FullName
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Exercise installed browser-login entry, loopback TLS and real synthetic WinCred
        env:
          GC_SYNTHETIC_WINCREDS_SMOKE: '1'
        shell: pwsh
        run: |
          if (-not (Get-Command openssl -ErrorAction SilentlyContinue)) {
            $openssl = Join-Path $env:ProgramFiles 'Git/usr/bin/openssl.exe'
            if (-not (Test-Path $openssl)) { throw 'The isolated OpenSSL test fixture is unavailable.' }
            $env:PATH = (Split-Path $openssl) + ';' + $env:PATH
          }
          $fixture = Join-Path $env:GITHUB_WORKSPACE 'tests/contracts/test_oauth_web_wincred_native.py'
          $python = Join-Path $env:RUNNER_TEMP 'oauth-web-install/Scripts/python.exe'
          Push-Location $env:RUNNER_TEMP
          try {
            & $python -I $fixture
            if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          } finally {
            Pop-Location
          }
